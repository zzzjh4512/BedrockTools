name: Build Android ARM64 Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 允许手动点按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: 2d45c1c877051094279337ad0532a5df95c1dc7f
        fetch-depth: 0 # 必须要有，为了拉取完整历史以提取补丁

    - name: Extract Patch File
      run: |
        # 尝试从 main 或 master 分支提取补丁文件
        if git show origin/main:chinese-localization-v154.patch > chinese-localization-v154.patch 2>/dev/null; then
          echo "✅ 成功从 main 分支提取补丁"
        elif git show origin/master:chinese-localization-v154.patch > chinese-localization-v154.patch 2>/dev/null; then
          echo "✅ 成功从 master 分支提取补丁"
        else
          echo "❌ 找不到补丁文件，请检查文件名和所在分支！"
          exit 1
        fi

    - name: Apply Chinese Localization Patch
      run: |
        echo "补丁文件大小: $(wc -c < chinese-localization-v154.patch) 字节"
        # 加上 --ignore-whitespace 防止因为不可见的空格/换行符导致应用失败
        git apply --ignore-whitespace chinese-localization-v154.patch
        echo "✅ 补丁应用成功！"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Download Android NDK r28c
      run: |
        echo "Downloading NDK r28c..."
        wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
        unzip -q android-ndk-r28c-linux.zip -d ${{ github.workspace }}

    - name: Build Mod with xmake
      run: |
        # 配置android arm64目标，指定刚刚下载的NDK路径
        xmake f -y -p android -a arm64-v8a -m release --ndk=${{ github.workspace }}/android-ndk-r28c
        # 执行编译
        xmake -y

    - name: Upload Levipack Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BedrockTools-Chinese
        path: build/**/*.levipack
